[package]
name = "daw-plugin-manager"
version = "1.0.0"
description = "Read-only discovery of installed DAWs and audio plugins, with update status"
edition = "2021"
publish = false

[lib]
name = "daw_plugin_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "~2.6"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
plist = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
