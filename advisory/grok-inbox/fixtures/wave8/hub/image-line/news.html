		<style data-inlined="updates-listing.a567aa6.2418d2b.css">:root {--desktop-border-radius: 10px;--mobile-border-radius: 8px;--content-width: 1200px;--content-item-width: 800px;}
.updates-archive {color: #b8c1c6;width: 100%;font-size: 16px;line-height: 1.65em;}

.updates-title {font-weight: 600;color: #fff;font-size: 56px;}
.updates-subtitle {margin: 0;}
.updates-filter {display: flex;justify-content: center;margin-bottom: 60px;}
.updates-filter .filter-tabs {display: flex;gap: 10px;flex-wrap: wrap;justify-content: center;align-items: center;}
.updates-filter .filter-tab {color: #fff;text-decoration: none;font-size: 15px;font-weight: 500;padding: 10px 15px;line-height: 1em;border-radius: 20px;transition: all .2s ease;background: rgba(255,255,255,.075);opacity: .7;}
.updates-filter .filter-tab:hover {color: #fff;opacity: 1;}
.updates-filter .filter-tab.active {opacity: 1;color: #fff;}
.updates-feed {width: 100%;max-width: var(--content-width);display: flex;flex-direction: column;gap: 0;margin: 0 auto;}
.updates-feed--grid {display: grid;grid-template-columns: repeat(auto-fill,minmax(300px,1fr));gap: 35px;max-width: 100%;}
.updates-feed--grid:hover .update-item {opacity: .75;}
.updates-feed--grid .update-item {position: relative;overflow: hidden;display: flex;flex-direction: column;border-radius: 0;gap: 25px;transition: opacity .3s ease;cursor: pointer;opacity: 1;}
.updates-feed--grid .update-item:hover {opacity: 1 !important;}
.updates-feed--grid .update-item:hover .update-card-image img {transform: scale(1.05);}
.updates-feed--grid .update-item:hover .update-title-link {text-decoration: underline;}
.updates-feed--grid .update-item .update-card-link {position: absolute;inset: 0;z-index: 1;}
.updates-feed--grid .update-item a, .updates-feed--grid .update-item button {position: relative;z-index: 2;}
.updates-feed--grid .update-card-image {display: block;overflow: hidden;background: rgba(255,255,255,.05);pointer-events: none;position: relative;border-radius: var(--desktop-border-radius);line-height: 0;}
.updates-feed--grid .update-card-image img {width: 100%;height: auto;display: block;transition: transform .3s ease;transform-origin: center center;}
.updates-feed--grid .update-card-content {display: flex;flex-direction: column;gap: 10px;flex: 1;}
.updates-feed--grid .update-header {gap: 10px;}
.updates-feed--grid .update-title {font-size: 18px;line-height: 1.3;margin: 0;max-width: 100%;}
.updates-feed--grid .update-meta {display: none;}
.updates-feed--grid .update-excerpt {flex: 1;display: flex;flex-direction: column;gap: 15px;}
.updates-feed--grid .update-excerpt p {margin: 0;line-height: 1.6;color: #b8c1c6;}
.update-item {display: flex;flex-direction: column;gap: 30px;}
.updates-feed--list .update-item:not(:last-child) {padding-bottom: 75px;margin-bottom: 75px;border-bottom: 1px solid rgba(255,255,255,.1);}
.update-layout-wrapper {display: grid;grid-template-columns: 1fr 2fr;gap: 40px;align-items: start;justify-content: space-between;}
.update-sidebar {position: sticky;top: 100px;display: flex;flex-direction: column;gap: 12px;}
.update-sidebar .update-title {font-size: 17px;line-height: 1.3;margin: 0;}

.update-sidebar .update-meta a {color: inherit;text-decoration: none;}
.update-sidebar .update-meta a:hover {text-decoration: underline;}
.update-sidebar .update-status-callout {display: inline-flex;align-items: center;gap: 6px;width: -moz-fit-content;width: fit-content;padding: 6px 10px;border-radius: 4px;font-size: 12px;line-height: 1.2;margin-top: 12px;}
.update-sidebar .update-status-callout .status-label {font-weight: 700;text-transform: uppercase;letter-spacing: .5px;font-size: 12px;}

.update-title {font-weight: 600;color: #fff;max-width: 80%;font-size: 18px;}
