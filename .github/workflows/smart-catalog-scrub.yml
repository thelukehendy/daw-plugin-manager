name: Smart catalog scrub

# RETIRED: catalog.json is store-export only (Coding Assistant / Grok Bot SQLite).
# Flash / sticky / Antigravity must never write latestVersion into the published catalog.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smart-catalog-scrub
  cancel-in-progress: false

jobs:
  scrub:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy smart catalog scrub
        run: |
          echo "::error::Legacy smart-catalog-scrub is permanently disabled."
          echo "Versions come only from store-export:v* published to catalog/catalog.json."
          echo "Do not re-enable Flash, sticky-reverify, or Antigravity writers."
          exit 1
