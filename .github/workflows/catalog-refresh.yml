name: Refresh plugin catalog

# RETIRED: catalog.json is store-export only (Coding Assistant / Grok Bot SQLite).
# Legacy scrapers must never write latestVersion into the published catalog.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy catalog refresh
        run: |
          echo "::error::Legacy catalog:refresh is permanently disabled."
          echo "Versions come only from store-export:v* published to catalog/catalog.json."
          echo "Do not re-enable scrapers, Flash, Antigravity, or discovery writers."
          exit 1
