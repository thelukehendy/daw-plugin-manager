name: Antigravity catalog scrub

# Weekly Gemini Antigravity pass for public version verification.
# Complements the deterministic scraper workflow (catalog-refresh.yml).
# Uses repo secret GEMINI_API_KEY (Google AI Studio / Gemini API key).
# Free-tier friendly: small batch size by default.

on:
  schedule:
    # Weekly Monday 18:00 UTC (after scraper job at 15:00)
    - cron: '0 18 * * 1'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Products to verify this run (keep small on free tier)'
        required: false
        default: '10'
      dry_run:
        description: 'If true, write export/cursor only — do not modify catalog.json'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: antigravity-catalog-scrub
  cancel-in-progress: false

jobs:
  scrub:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Require GEMINI_API_KEY secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "Missing repository secret GEMINI_API_KEY."
            echo "Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Run Antigravity scrub batch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTIGRAVITY_BATCH_SIZE: ${{ github.event.inputs.batch_size || '10' }}
          ANTIGRAVITY_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: node scripts/catalog/antigravity-scrub.js
        timeout-minutes: 40

      - name: Install deps + validate catalog
        if: ${{ github.event_name == 'schedule' || github.event.inputs.dry_run != 'true' }}
        run: |
          npm ci
          npm run catalog:validate

      - name: Commit results if changed
        run: |
          git config user.name "catalog-bot"
          git config user.email "catalog-bot@users.noreply.github.com"
          git add -A catalog/antigravity-export.json catalog/antigravity-cursor.json catalog/catalog.json
          if git diff --staged --quiet; then
            echo "No catalog changes to commit."
          else
            git commit -m "chore(catalog): antigravity scrub $(date -u +%Y-%m-%d)"
            git push
          fi
