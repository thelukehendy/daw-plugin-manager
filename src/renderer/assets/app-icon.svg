<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16232b"/>
      <stop offset="1" stop-color="#0a1014"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7d2"/>
      <stop offset="1" stop-color="#2bb89f"/>
    </linearGradient>
    <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="268" y1="0" x2="618" y2="0">
      <stop offset="0" stop-color="#3dcfb6"/>
      <stop offset="1" stop-color="#8ef0de"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#1d3a3f"/>
      <stop offset="1" stop-color="#0f1c21"/>
    </radialGradient>
    <clipPath id="lensClip">
      <circle cx="440" cy="440" r="232"/>
    </clipPath>
  </defs>

  <!-- macOS icon grid: 824px rounded square inset 100px -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- handle -->
  <line x1="610" y1="610" x2="790" y2="790" stroke="#0a1014" stroke-width="108" stroke-linecap="round"/>
  <line x1="610" y1="610" x2="790" y2="790" stroke="url(#ring)" stroke-width="84" stroke-linecap="round"/>

  <!-- lens -->
  <circle cx="440" cy="440" r="232" fill="url(#lens)"/>
  <g clip-path="url(#lensClip)" stroke="url(#wave)" stroke-width="30" stroke-linecap="round">
    <line x1="268" y1="410" x2="268" y2="470"/>
    <line x1="318" y1="360" x2="318" y2="520"/>
    <line x1="368" y1="300" x2="368" y2="580"/>
    <line x1="418" y1="380" x2="418" y2="500"/>
    <line x1="468" y1="270" x2="468" y2="610"/>
    <line x1="518" y1="340" x2="518" y2="540"/>
    <line x1="568" y1="395" x2="568" y2="485"/>
    <line x1="618" y1="425" x2="618" y2="455"/>
  </g>
  <circle cx="440" cy="440" r="232" fill="none" stroke="url(#ring)" stroke-width="52"/>
</svg>
